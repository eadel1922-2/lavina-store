name: Keep Supabase Active

on:
  schedule:
    # يعمل تلقائيًا كل 3 أيام في الساعة 10 صباحًا بتوقيت UTC
    - cron: '0 10 */3 * *'
  workflow_dispatch: # يتيح لك تشغيله يدويًا للتجربة في أي وقت

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -f -s -o /dev/null -w "%{http_code}\n" \
            "https://uvhofkxnxhibbukxrqxb.supabase.co/rest/v1/products?select=id&limit=1" \
            -H "apikey: sb_publishable_SVuscFjsZVSkLQ55k0ZVJQ_m0CKNN1_" \
            -H "Authorization: Bearer sb_publishable_SVuscFjsZVSkLQ55k0ZVJQ_m0CKNN1_"
